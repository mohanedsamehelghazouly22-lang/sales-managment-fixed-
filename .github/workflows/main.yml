name: Build Sales Manager

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project root
        id: find
        run: |
          DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          echo "Found project at: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Generate platform folders and fix compileSdk
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          flutter create --platforms=android --project-name sales_manager .
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sales-manager-apk
          path: ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project root
        id: find
        shell: bash
        run: |
          DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          echo "Found project at: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate missing platform folders
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter create --platforms=windows --project-name sales_manager .

      - name: Get dependencies
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter pub get

      - name: Build Windows
        working-directory: ${{ steps.find.outputs.dir }}
        run: >
          flutter build windows --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: sales-manager-windows
          path: ${{ steps.find.outputs.dir }}/build/windows/x64/runner/Release/
